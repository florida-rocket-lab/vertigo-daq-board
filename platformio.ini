; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[env:stm32]
platform = ststm32
board = genericSTM32H750VB
platform_packages =
    toolchain-gccarmnoneeabi@1.140201.0 # override default gcc package with more recent version (v14)
    # this allows the linker script below to compile correctly

board_build.ldscript = Src/cubemx_autogen/ldscripts/STM32H750VBTX_FLASH.ld

upload_protocol = dfu
debug_tool = stlink

build_src_filter =
    +<Core/Src/*.c>
    +<Core/Startup/*.s>
    +<USB_DEVICE/App/*.c>
    +<USB_DEVICE/Target/*.c>
    +<Src/cubemx_autogen/Drivers/STM32H7xx_HAL_Driver/Src/*.c>
    +<Src/cubemx_autogen/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Src/*.c>
    +<Src/cubemx_autogen/Middlewares/ST/STM32_USB_Device_Library/Core/Src/*.c>

build_flags =
    -DUSE_HAL_DRIVER
    -ISrc/cubemx_autogen/Drivers/CMSIS/Include
    -ISrc/cubemx_autogen/Drivers/CMSIS/Device/ST/STM32H7xx/Include
    -ISrc/cubemx_autogen/Drivers/STM32H7xx_HAL_Driver/Inc
    -ICore/Inc
    -IUSB_DEVICE/App
    -IUSB_DEVICE/Target
    -ISrc/cubemx_autogen/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
    -ISrc/cubemx_autogen/Middlewares/ST/STM32_USB_Device_Library/Core/Inc

debug_build_flags =
    -g
    -DDEBUG

extra_scripts = pre:scripts/format_cubemx.py
